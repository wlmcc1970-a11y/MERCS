<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#174541">
<meta name="description" content="The official MERCS 2.5 field companion by DigiRune Studios.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MERCS">
<meta name="google" content="translate">
<title>MERCS Companion</title>
<script>
/* Apply saved low-light theme before first paint (no flash). */
(function(){try{
  var t=localStorage.getItem('mercs.theme');
  if(t==='dark'){
    document.documentElement.setAttribute('data-theme','dark');
    var m=document.querySelector('meta[name=theme-color]');
    if(m)m.setAttribute('content','#0e1c19');
  }
}catch(e){}})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Bungee&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#e8edec; --surface:#ffffff; --surface2:#f2f6f5; --surface3:#e6efed;
  --line:#cedad7; --line2:#b4c5c1;
  --ink:#14201e; --ink2:#33433f; --muted:#566a66; --faint:#8aa09b;
  --olive:#3f7a72; --olive-d:#174541; --olive-l:#8aa8a4; --olive-bg:#20574f;
  --orange:#f2cd3a; --orange-d:#7a6100;
  --brass:#1fa9be; --slate:#648280;
  --good:#2f7d32; --bad:#c0392b; --mid:#b8860b;
  --font-hero:'Bungee',Impact,'Arial Black',sans-serif;
  --font-disp:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --r:12px; --shadow:0 8px 26px rgba(16,34,31,.16); --shadow-s:0 3px 10px rgba(16,34,31,.12);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
/* ===== Low-light (dark) theme — light remains default ===== */
html[data-theme="dark"]{
  --bg:#0e1c19; --surface:#152a26; --surface2:#1b332e; --surface3:#22403a;
  --line:#2c433e; --line2:#3a544e;
  --ink:#e8efed; --ink2:#c4d1ce; --muted:#93a8a3; --faint:#7a908b;
  /* keep brand accents, lighten where they must read on dark */
  --olive:#5fa89d; --olive-d:#8fc5bc; --olive-l:#a9d6ce; --olive-bg:#174541;
  --orange:#f2cd3a; --orange-d:#e7c53a;
  --good:#5bbf5f; --bad:#e8675a; --mid:#d8a93a;
  --shadow:0 8px 26px rgba(0,0,0,.5); --shadow-s:0 3px 10px rgba(0,0,0,.4);
}
/* surfaces that hard-coded near-black text on olive chips stay readable (olive-d is now light on dark) */
html[data-theme="dark"] .unitcard .fac,
html[data-theme="dark"] .wtable th,
html[data-theme="dark"] .handcard .cop,
html[data-theme="dark"] .obj .op{color:#0e1c19}
/* sticky tally gradient uses the dark bg */
html[data-theme="dark"] .tally{background:linear-gradient(0deg,var(--bg),rgba(14,28,25,.85))}
/* manual open header gradient on dark */
html[data-theme="dark"] .manual[open]>summary{background:linear-gradient(180deg,#1a3733,#132a27)}
/* rule callout text was a hard olive — use token on dark */
html[data-theme="dark"] .rule{color:var(--ink2)}
/* dark header: olive-d is a light text tone on dark, so the token gradient went PALER than light mode;
   use a true dark-olive gradient so the white logo/wordmark stays ≥3:1 */
html[data-theme="dark"] header.bar{background:linear-gradient(180deg,#1c534c,#123f39)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{overflow-anchor:none}
.unitcard{scroll-margin-top:76px}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.5;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100%}
.wrap{max-width:780px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--font-disp);letter-spacing:.02em}
/* ---- top bar (olive military band) ---- */
header.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.7rem;
  padding:calc(.5rem + var(--safe-t)) .9rem .5rem;background:linear-gradient(180deg,var(--olive),var(--olive-d));
  border-bottom:3px solid var(--orange);box-shadow:var(--shadow-s)}
.bar .logo{height:30px;display:block}
.bar .loghome{cursor:pointer;padding:7px 4px;height:44px;box-sizing:content-box;margin:-7px 0;border-radius:8px}
.bar .loghome:active{background:rgba(0,0,0,.18)}
.bar .loghome:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
.bar .ttl{font-family:var(--font-disp);font-weight:600;letter-spacing:.22em;color:#eef3f2;font-size:.72rem;
  text-transform:uppercase;opacity:.9}
.bar .sp{margin-left:auto}
.backbtn{display:none;align-items:center;gap:.3rem;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.14);
  color:#fff;border-radius:9px;padding:.4rem .7rem;font-weight:700;font-size:.8rem;min-height:38px;font-family:var(--font-disp);letter-spacing:.06em}
.backbtn:active{background:rgba(0,0,0,.28)}
.acctbtn{border:1px solid rgba(255,255,255,.24);background:rgba(0,0,0,.14);color:#eef6f4;border-radius:9px;
  padding:.4rem .62rem;font-family:var(--font-body,inherit);font-weight:600;letter-spacing:.01em;font-size:.74rem;
  min-height:38px;display:flex;align-items:center;gap:.42rem;white-space:nowrap}
.acctbtn:active{background:rgba(0,0,0,.26)}
/* status dot conveys state quietly: muted-red = signed out, amber = on-device only, green = synced */
.acctbtn .sdot{width:8px;height:8px;border-radius:50%;flex:none;background:#cf7b74;box-shadow:0 0 0 3px rgba(207,123,116,.16)}
.acctbtn.dev .sdot{background:#d9b24a;box-shadow:0 0 0 3px rgba(217,178,74,.16)}
.acctbtn.in .sdot{background:#57b97d;box-shadow:0 0 0 3px rgba(87,185,125,.18)}
.acctbtn.in,.acctbtn.dev{background:rgba(0,0,0,.14);color:#eef6f4;border-color:rgba(255,255,255,.24)}
.acctbtn .albl{text-transform:none}
/* --- official sign-in buttons (Google brand: white / colored G; Apple HIG: black) --- */
.signin-official{display:flex;flex-direction:column;gap:.55rem;margin:.7rem 0 .3rem}
.gsi-btn,.asi-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:46px;padding:0 16px;border-radius:8px;font-size:15px;font-weight:600;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
.gsi-btn{background:#fff;color:#1f1f1f;border:1px solid #747775;font-family:'Roboto',var(--font-body,'Barlow'),system-ui,-apple-system,sans-serif}
.gsi-btn:active{background:#f2f2f2}
.asi-btn{background:#fff;color:#000;border:1px solid #747775;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',var(--font-body,'Barlow'),system-ui,sans-serif}
.asi-btn:active{background:#f2f2f2}
.gsi-btn svg,.asi-btn svg{flex:none;display:block}
.asi-btn svg{margin-top:-2px}
.btn.danger{background:#7a1f1f;color:#fff;border-color:#9b2b2b}
.btn.danger:active{background:#611818}
/* --- first-run sync tip (once-only, dismissible) --- */
#syncTip{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);z-index:1200;max-width:94%;width:430px;display:flex;align-items:center;gap:.55rem;background:rgba(18,30,28,.96);border:1px solid rgba(31,169,190,.45);border-radius:12px;padding:.58rem .7rem;box-shadow:0 10px 30px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#syncTip .stx{flex:1;font-size:.77rem;line-height:1.4;color:#d7e6e2}
#syncTip .stx b{color:#eaf6f3;font-weight:700}
#syncTip .stgo{flex:none;min-height:36px;padding:.36rem .72rem;font-weight:700;font-size:.75rem;color:#eafcff;background:transparent;border:1px solid rgba(31,169,190,.65);border-radius:8px;cursor:pointer}
#syncTip .stgo:active{background:rgba(31,169,190,.14)}
#syncTip .stx-close{flex:none;min-width:34px;min-height:34px;background:transparent;border:none;color:#8aa39d;font-size:1rem;cursor:pointer;line-height:1}
/* ---- home / splash ---- */
.splash{background:linear-gradient(180deg,#174541 0%,#20574f 55%,#2c6a61 100%);
  border-bottom:3px solid var(--ink);padding:1.7rem 1.1rem 1.6rem;text-align:center;position:relative;overflow:hidden}
.splash::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.10) 1.4px,transparent 1.5px);
  background-size:15px 15px;opacity:.6;pointer-events:none}
.splash .logo{width:min(78%,360px);filter:drop-shadow(0 4px 12px rgba(6,26,23,.55));position:relative}
.splash .cause{font-family:var(--font-disp);font-weight:700;letter-spacing:.14em;color:#eaf3f1;text-transform:uppercase;
  font-size:.86rem;margin:.7rem 0 0;position:relative;text-shadow:0 1px 2px rgba(6,26,23,.5)}
.splash .cause b{color:#fff}
.splash .kick{font-family:var(--font-hero);color:#fff;font-size:1.9rem;margin:.45rem 0 0;letter-spacing:.01em;position:relative;
  text-transform:uppercase;-webkit-text-stroke:2px #0d322d;paint-order:stroke fill;
  text-shadow:0 3px 0 #0d322d,0 5px 8px rgba(6,26,23,.45)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;padding:1.1rem 1.1rem calc(1.4rem + var(--safe-b))}
@media(max-width:440px){.tiles{grid-template-columns:1fr}}
.tile{position:relative;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  padding:.95rem .95rem .9rem 1.1rem;min-height:120px;display:flex;flex-direction:column;gap:.25rem;
  box-shadow:var(--shadow-s);transition:transform .14s,box-shadow .14s,border-color .14s;overflow:hidden}
.tile:active{transform:translateY(1px) scale(.995)}
.tile:hover{box-shadow:var(--shadow);border-color:var(--olive-l)}
.tile .edge{position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--olive),var(--olive-d))}
.tile .ico{width:30px;height:30px;color:var(--orange)}
.tile h3{margin:.2rem 0 0;font-size:1.05rem;color:var(--ink);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.tile p{margin:0;color:var(--muted);font-size:.82rem;line-height:1.36}
.tile .go{margin-top:auto;font-family:var(--font-disp);font-weight:700;font-size:.72rem;letter-spacing:.1em;
  color:var(--orange-d);text-transform:uppercase}
/* ---- views ---- */
.view{display:none;padding:0 1.1rem calc(2.2rem + var(--safe-b));animation:fade .22s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vh{font-size:1.3rem;margin:1.1rem 0 .15rem;color:var(--ink);text-transform:uppercase;font-weight:700}
.vsub{color:var(--muted);font-size:.88rem;margin:0 0 .8rem}
/* ---- field manual (tutorial) — eye-catching but tasteful ---- */
.manual{border:1px solid var(--olive-l);border-left:4px solid var(--orange);border-radius:11px;background:var(--surface2);margin:.2rem 0 1rem;overflow:hidden;box-shadow:var(--shadow-s)}
.manual>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.5rem;padding:.62rem .85rem;
  font-family:var(--font-disp);font-weight:700;letter-spacing:.08em;color:var(--orange-d);text-transform:uppercase;font-size:.84rem;
  background:linear-gradient(180deg,#eaf3f1,#dcebe8)}
.manual>summary::-webkit-details-marker{display:none}
.manual>summary .mico{width:18px;height:18px;flex:none;color:var(--orange)}
.manual>summary .mico svg{width:18px;height:18px;display:block}
.manual>summary .tw{margin-left:auto;transition:transform .2s;color:var(--orange)}
.manual[open]>summary .tw{transform:rotate(90deg)}
.manual[open]{border-left-color:var(--olive)}
.manual[open]>summary{color:var(--olive-d);background:linear-gradient(180deg,#e2efec,#d3e6e1)}
.manual[open]>summary .mico,.manual[open]>summary .tw{color:var(--olive)}
.manual .mbody{padding:.5rem .9rem .8rem}
/* one-time attention cue on the first manual seen per session */
.manual.cue{animation:manualcue 2.4s ease-out 1}
@keyframes manualcue{0%,100%{box-shadow:var(--shadow-s)}18%{box-shadow:0 0 0 3px rgba(242,205,58,.42),0 6px 18px rgba(16,34,31,.18)}55%{box-shadow:0 0 0 2px rgba(242,205,58,.22),var(--shadow-s)}}
@media(prefers-reduced-motion:reduce){.manual.cue{animation:none}}
.manual ol{margin:.2rem 0;padding-left:1.1rem}
.manual ol li{margin:.32rem 0;font-size:.88rem;color:var(--ink2)}
.manual ol li b{color:var(--olive-d)}
.manual .tip{margin-top:.5rem;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line2);padding-top:.45rem}
/* ---- rule banner ---- */
.rule{display:flex;gap:.5rem;align-items:flex-start;background:#e6f0ee;border:1px solid #c2d5d1;
  border-left:3px solid var(--olive);border-radius:9px;padding:.55rem .7rem;color:#2b3d39;font-size:.82rem;margin:.2rem 0 1rem}
.rule b{color:var(--olive-d)}
/* ---- controls ---- */
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
select,input[type=number],input[type=search]{background:var(--surface);color:var(--ink);border:1px solid var(--line2);
  border-radius:10px;padding:.55rem .65rem;font-size:.92rem;min-height:44px;font-family:var(--font-body)}
select{min-width:140px}
.btn{border:1px solid #0e332e;background:linear-gradient(#1f5b53,#123f39);color:#eef6f4;
  font-weight:700;border-radius:10px;padding:.6rem .9rem;min-height:44px;font-family:var(--font-disp);letter-spacing:.05em;text-transform:uppercase;font-size:.86rem}
.btn .acc,.btn:focus-visible{outline:2px solid var(--orange)}
.btn:active{filter:brightness(.95)}
.btn.ghost{background:var(--surface);color:var(--olive-d);border-color:var(--line2);font-weight:700}
.btn.sm{padding:.42rem .62rem;min-height:38px;font-size:.76rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--surface3);border:1px solid var(--line2);
  border-radius:999px;padding:.22rem .6rem;font-size:.74rem;color:var(--ink2);font-family:var(--font-disp);letter-spacing:.04em}
.chip b{color:var(--olive-d)}
.chip.q{background:#e6efe8;border-color:#b9d0c6;color:#2f4a41}
.chip.dep{background:#e6eced;border-color:#bcc9cd;color:#2f4650}
.muted{color:var(--muted)}.small{font-size:.8rem}
.divider{height:1px;background:var(--line);margin:1rem 0}
/* ---- list / cards ---- */
.list{display:flex;flex-direction:column;gap:.45rem;margin-top:.6rem}
.item{display:flex;align-items:center;gap:.6rem;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:.55rem .7rem;min-height:50px;box-shadow:var(--shadow-s)}
.item .nm{font-weight:700;font-family:var(--font-disp);letter-spacing:.02em}
.item .meta{color:var(--muted);font-size:.78rem}
.item .grow{flex:1}
.item .ar{color:var(--orange-d);font-weight:700}
.unitcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem;box-shadow:var(--shadow);margin-top:.6rem}
.unitcard .uhead{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;border-bottom:2px solid var(--olive);padding-bottom:.4rem;cursor:pointer}
.unitcard h3{margin:0;font-size:1.35rem;color:var(--ink);text-transform:uppercase;font-weight:700}
.unitcard .fac{color:#fff;background:var(--olive-d);font-weight:700;letter-spacing:.1em;font-size:.66rem;
  text-transform:uppercase;padding:.12rem .45rem;border-radius:5px;font-family:var(--font-disp)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:.9rem 0}
.stat{border:1px solid var(--line2);border-radius:10px;padding:.45rem .35rem;text-align:center;background:var(--surface2);cursor:pointer;transition:transform .1s}
.stat:active{transform:scale(.97)}
.stat .k{font-size:.64rem;letter-spacing:.08em;color:var(--muted);font-weight:700;font-family:var(--font-disp)}
.stat .v{font-size:1.55rem;font-weight:700;line-height:1.05;margin-top:.05rem;font-family:var(--font-hero)}
.stat .bar{height:4px;border-radius:3px;margin-top:.32rem;background:#e2dcc d;background:#e3ddcd;overflow:hidden}
.stat .bar i{display:block;height:100%}
.wtable{width:100%;border-collapse:collapse;margin:.5rem 0 .2rem;font-size:.86rem}
.wtable th{color:#fff;background:var(--olive-d);font-weight:600;text-align:center;font-size:.66rem;letter-spacing:.05em;padding:.28rem .2rem;font-family:var(--font-disp)}
.wtable th:first-child{text-align:left;padding-left:.5rem;border-radius:5px 0 0 0}
.wtable th:last-child{border-radius:0 5px 0 0}
.wtable td{border-bottom:1px solid var(--line);padding:.4rem .3rem;text-align:center}
.wtable td.wn{text-align:left;font-weight:700;font-family:var(--font-disp)}
.kw{display:inline-block;background:var(--surface3);border:1px solid var(--line2);border-radius:5px;padding:.02rem .35rem;font-size:.7rem;color:var(--orange-d);margin:0 .15rem .15rem 0;font-weight:600}
.ablist{margin:.5rem 0 0;padding:0;list-style:none}
.ablist li{padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.88rem;color:var(--ink2)}
.ablist b{color:var(--olive-d);font-family:var(--font-disp);letter-spacing:.02em}
/* tracker */
.trkitem{display:flex;align-items:center;gap:.6rem;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:.5rem .65rem;box-shadow:var(--shadow-s)}
.trkitem.done{opacity:.5}
.trkitem.active{border-color:var(--orange);box-shadow:0 0 0 2px rgba(242,205,58,.25)}
.initbadge{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;
  background:var(--surface3);border:1px solid var(--line2);font-weight:700;font-size:1.2rem;font-family:var(--font-hero);color:var(--ink)}
.initbadge.lead{background:linear-gradient(var(--orange),var(--orange-d));color:#14201e;border-color:var(--orange-d);text-shadow:0 1px 0 rgba(255,255,255,.25)}
/* objectives */
.obj{display:flex;align-items:center;gap:.6rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;cursor:pointer}
.obj.checked{border-color:var(--good);background:#eaf3ea}
.obj .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--faint);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800}
.obj.checked .box{border-color:var(--good);background:var(--good);color:#fff}
.obj .op{margin-left:auto;font-weight:700;color:var(--orange-d);font-family:var(--font-disp)}
.tally{position:sticky;bottom:0;background:linear-gradient(0deg,var(--bg),rgba(233,229,219,.85));padding:.7rem 0 calc(.5rem + var(--safe-b));
  margin-top:.8rem;border-top:2px solid var(--olive);display:flex;align-items:center;gap:.6rem;font-weight:700;font-family:var(--font-disp);letter-spacing:.04em;text-transform:uppercase;font-size:.82rem;color:var(--ink2)}
.tally .big{margin-left:auto;font-size:1.5rem;color:var(--orange-d);font-family:var(--font-hero)}
/* contingency */
.handcard{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:.7rem .8rem;box-shadow:var(--shadow-s)}
.handcard.live{border-color:var(--orange);box-shadow:0 0 0 2px rgba(242,205,58,.25)}
.handcard .ct{font-weight:700;font-family:var(--font-disp);letter-spacing:.02em;font-size:1rem;text-transform:uppercase}
.handcard .cop{color:#fff;background:var(--olive-d);font-weight:700;font-size:.74rem;border-radius:5px;padding:.05rem .4rem;font-family:var(--font-disp)}
.handcard .cx{font-size:.85rem;color:var(--ink2);margin-top:.35rem}
.handcard .row2{display:flex;gap:.4rem;margin-top:.5rem;flex-wrap:wrap}
.tagline{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.78rem;margin:.2rem 0 .6rem}
/* damage */
.dmg{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:.7rem .8rem;margin-bottom:.55rem;box-shadow:var(--shadow-s)}
.dmg.dead{border-color:var(--bad);background:#fbeceb}
.bloodrow{display:flex;align-items:center;gap:.5rem;margin:.5rem 0}
.pips{display:flex;gap:.25rem;flex-wrap:wrap}
.pip{width:20px;height:20px;border-radius:50%;border:2px solid var(--bad);background:transparent}
.pip.full{background:var(--bad)}
.statusrow{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.4rem}
.stog{border:1px solid var(--line2);background:var(--surface2);color:var(--muted);border-radius:999px;padding:.22rem .55rem;font-size:.74rem;min-height:34px;font-family:var(--font-disp);letter-spacing:.03em}

/* ---- translate language picker ---- */

/* offline-precache bottom indicator (reuses toast styling) */

/* low-light header toggle */

/* ===== Compare tool ===== */
.cmp-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.6rem 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

.modnotes{font-size:.82rem;color:var(--muted);margin-top:.4rem;line-height:1.5}
/* keywords glossary */
.glosslist{margin-top:.6rem}
.glo{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.55rem .75rem;margin-bottom:.45rem;box-shadow:var(--shadow-s)}
.glo .gn{font-family:var(--font-disp);font-weight:700;letter-spacing:.02em;color:var(--olive-d);text-transform:uppercase;font-size:.92rem}
.glo .gt{font-size:.86rem;color:var(--ink2);margin-top:.15rem}
/* tools + search overlays */
.tools,.search{position:fixed;inset:0;z-index:55;background:rgba(11,26,24,.55);display:none}
.tools.open,.search.open{display:block}
.toolsheet,.searchsheet{position:absolute;left:0;right:0;bottom:0;top:0;background:var(--bg);max-width:780px;margin:0 auto;display:flex;flex-direction:column;animation:slidein .22s ease}
@keyframes slidein{from{transform:translateY(20px);opacity:.5}to{transform:none;opacity:1}}
.toolsbar{position:sticky;top:0;display:flex;align-items:center;gap:.6rem;padding:calc(.6rem + var(--safe-t)) .9rem .6rem;
  background:linear-gradient(180deg,var(--olive),var(--olive-d));border-bottom:3px solid var(--orange);color:#eef3f2}
.toolsbar h2{margin:0;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.toolsbar .sp{margin-left:auto}
.toolscont{flex:1;overflow-y:auto;padding:1rem 1.1rem calc(1.6rem + var(--safe-b));-webkit-overflow-scrolling:touch}
.toolmenu{display:flex;flex-direction:column;gap:.6rem}
.toolcard{display:flex;align-items:center;gap:.8rem;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:.8rem .9rem;box-shadow:var(--shadow-s);min-height:64px}
.toolcard .ico{width:30px;height:30px;color:var(--orange);flex:none}
.toolcard h3{margin:0;font-size:1.02rem;text-transform:uppercase}
.toolcard p{margin:.1rem 0 0;font-size:.8rem;color:var(--muted)}
.toolcard .ar{margin-left:auto;color:var(--orange-d);font-weight:700;font-family:var(--font-disp)}
/* search */
.searchhead{position:sticky;top:0;display:flex;align-items:center;gap:.5rem;padding:calc(.6rem + var(--safe-t)) .9rem .6rem;
  background:linear-gradient(180deg,var(--olive),var(--olive-d));border-bottom:3px solid var(--orange)}
.searchhead input{flex:1;min-height:44px}
.searchcont{flex:1;overflow-y:auto;padding:.8rem 1.1rem calc(1.6rem + var(--safe-b))}
.sgrp{margin-bottom:.9rem}
.sgh{font-family:var(--font-disp);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--olive-d);font-size:.74rem;margin:.3rem 0;display:flex;align-items:center;gap:.4rem}
.sgh span{background:var(--olive-d);color:#fff;border-radius:999px;padding:.02rem .45rem;font-size:.68rem}
.sres{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:.5rem .7rem;margin-bottom:.35rem;min-height:46px;box-shadow:var(--shadow-s)}
.sres .sl{font-weight:700;font-family:var(--font-disp);color:var(--ink)}
.sres .ss{font-size:.76rem;color:var(--muted)}
mark{background:#ffe39a;color:#5a3a00;border-radius:3px;padding:0 .1em}
/* strike team validation */
.bad{color:var(--bad);font-weight:700}.good{color:var(--good);font-weight:700}
/* spinner */
.spinner{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(233,229,219,.4)}
.spinner.show{display:flex}
.spinner i{width:38px;height:38px;border:4px solid var(--line2);border-top-color:var(--orange);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
footer.src{padding-bottom:calc(1.4rem + var(--tabbar-h) + var(--safe-b))}


/* search deep-link highlight pulse (restored) */
.rec-hl{animation:recpulse 2s ease-out 1}
@keyframes recpulse{0%{box-shadow:0 0 0 0 rgba(242,205,58,.0);outline:2px solid rgba(242,205,58,0)}12%{box-shadow:0 0 0 4px rgba(242,205,58,.45);outline:2px solid var(--orange)}100%{box-shadow:0 0 0 0 rgba(242,205,58,0);outline:2px solid rgba(242,205,58,0)}}

.ucls{margin-left:.4rem;background:transparent;border:1px solid var(--line2);color:var(--muted);border-radius:8px;min-width:36px;min-height:36px;font-size:1rem;line-height:1;cursor:pointer;position:relative}
.ucls::after{content:"";position:absolute;inset:-5px}
.ucls:hover{border-color:var(--orange);color:var(--orange-d)}

.rsub{font-family:var(--font-disp);font-size:1rem;letter-spacing:.04em;color:var(--olive-d);text-transform:uppercase;margin:1.15rem 0 .35rem;padding-bottom:.2rem;border-bottom:1px solid var(--line2)}
.rulebook .rsub{font-size:1.02rem}

/* ===== FIX: small-screen hamburger nav + mobile menu overlay ===== */
.navham{display:none;align-items:center;justify-content:center;width:44px;height:44px;min-height:44px;
  border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.16);color:#eef6f4;border-radius:9px;padding:0;flex:none}
.navham svg{width:22px;height:22px}
.navham:active{background:rgba(0,0,0,.32)}
.navham.in{background:var(--orange);color:#14201e;border-color:var(--orange-d)}
#navMenu{position:fixed;inset:0;z-index:120;display:none;flex-direction:column;
  padding:max(.9rem,var(--safe-t)) max(1rem,env(safe-area-inset-right,0px)) max(1.1rem,var(--safe-b)) max(1rem,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(14,28,25,.97),rgba(40,40,20,.97));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;animation:fade .2s ease}
#navMenu.open{display:flex}
.navhead{display:flex;align-items:center;gap:.7rem;border-bottom:2px solid var(--orange);padding-bottom:.7rem;margin-bottom:.5rem}
.navhead .navlogo{height:30px;display:block}
.navhead .navwm{font-family:var(--font-disp);font-weight:600;letter-spacing:.22em;color:#eef3f2;font-size:.72rem;text-transform:uppercase;opacity:.92}
.navhead .navclose{margin-left:auto;width:44px;height:44px;min-height:44px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.2);color:#eef6f4;border-radius:10px;font-size:1.3rem;line-height:1;padding:0}
.navhead .navclose:active{background:rgba(0,0,0,.4)}
.navlist{display:flex;flex-direction:column;gap:.45rem;margin:.4rem 0 .2rem}
.navlink{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;min-height:52px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:.6rem .8rem;
  color:#ece9dd;font-family:var(--font-disp);font-weight:600;letter-spacing:.04em;font-size:1rem;text-transform:uppercase}
.navlink .nico{width:26px;height:26px;color:var(--orange);flex:none}
.navlink .nico svg{width:26px;height:26px;display:block}
.navlink:active{background:rgba(242,205,58,.18)}
.navlink.on{border-color:var(--orange);background:rgba(242,205,58,.16);color:#fff}
.navlink.on .nico{color:var(--orange)}
.navsep{height:1px;background:rgba(255,255,255,.14);margin:.7rem 0 .55rem}
.navacts{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.navact{display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;border-radius:11px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#ece9dd;
  font-family:var(--font-disp);font-weight:600;letter-spacing:.04em;font-size:.82rem;text-transform:uppercase;padding:.5rem}
.navact .nico{width:20px;height:20px;color:var(--orange);flex:none}
.navact .nico svg{width:20px;height:20px;display:block}
.navact:active{background:rgba(242,205,58,.18)}
/* ===== Google Translate Element: suppress injected banner/offset/tooltip ===== */
.goog-te-banner-frame,.skiptranslate{display:none!important}
body{top:0!important}
#goog-gt-tt,.goog-tooltip,.goog-te-balloon-frame{display:none!important}
#gte{display:none}
/* ===== FIX: small-screen layout — hamburger replaces bottom tab bar ===== */
@media(max-width:700px){
  .navham{display:flex}
  #tabbar{display:none}
  body{padding-bottom:calc(.4rem + var(--safe-b))}
  footer.src{padding-bottom:calc(1.4rem + var(--safe-b))}
}
@media(min-width:701px){
  .navham{display:none}
  #navMenu{display:none!important}
}
/* ===== FIX: dynamic viewport height + overflow guards ===== */
body{min-height:100vh;min-height:100dvh}
.wrap{overflow-x:hidden}
header.bar{flex-wrap:wrap}
.barbtns{flex-wrap:wrap;row-gap:.35rem}
@media(max-width:360px){.iconbtn{width:40px;height:40px;min-height:40px}.barbtns{gap:.3rem}}
/* ===== FIX: launch splash logo never clips ===== */
.launch .llogo{width:min(74%,360px);max-height:38vh;height:auto;object-fit:contain}


@media(max-width:700px){
  .bar .barbtns #xlateBtn,.bar .barbtns #themeBtn,.bar .barbtns #toolsBtn,.bar .barbtns .acctbtn{display:none!important}
  header.bar{flex-wrap:nowrap}
  .bar .barbtns{order:8;flex-wrap:nowrap;margin-left:auto}
  .bar .navham{order:9;margin-left:.3rem;flex:none}
  .bar .ttl{display:none}
}

.navactlabel{font-family:var(--font-disp);font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--olive-l);opacity:.95;margin:.1rem 0 .55rem;padding-left:.15rem}
.navact-wide{grid-column:1/-1}

/* ===== 2026-07 publisher palette — teal base, restrained saber-yellow accent, cyan frames ===== */
:root{--cyan:#1fa9be;--cyan-d:#0f6b78;--font-head:'Black Ops One','Oswald','Arial Narrow',system-ui,sans-serif}
html[data-theme="dark"]{--cyan:#3ec3d5;--cyan-d:#8fd9e2}
h1,h2,h3,h4,.vh,.bar .ttl,.splash .cause,.handcard .ct{font-family:var(--font-head)}
.bar .ttl{letter-spacing:.1em}
header.bar{border-bottom:3px solid var(--cyan)}
.tile .ico{color:var(--cyan)}
.tile .edge{background:linear-gradient(180deg,#f2cd3a,#d9b21f)}
</style>
</head>
<body>
<div class="launch" id="launchSplash" aria-hidden="true">
  <img class="llogo" src="assets/logo_white.png" alt="MERCS">
</div>
<div class="wrap">
  <header class="bar">
    <img class="logo loghome" id="barLogo" src="assets/logo_white.png" alt="MERCS — Home" role="button" tabindex="0" aria-label="Home">
    <span class="ttl">Companion</span>
    <button class="navham" id="navHamBtn" aria-label="Menu" aria-expanded="false" title="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="barbtns">
      <button class="iconbtn" id="searchBtn" title="Search" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
      <button class="iconbtn" id="xlateBtn" title="Translate" aria-label="Translate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15.5 0 18M12 3c-2.5 2.5-2.5 15.5 0 18"/></svg></button>
      <button class="iconbtn themebtn" id="themeBtn" title="Low-light mode" aria-label="Toggle low-light mode"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
      <button class="iconbtn" id="toolsBtn" title="Field Tools" aria-label="Field Tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 1 5.4-5.4l-2.3 2.3-1.4-1.4z"/></svg></button>
      <button class="acctbtn" id="acctBtn" aria-label="Sign in to sync"><span class="sdot" aria-hidden="true"></span><span class="albl">Sign in</span></button>
    </div>
  </header>

  <main id="panels">
    <section class="panel" id="panel-home"></section>
    <section class="panel" id="panel-megacons"></section>
    <section class="panel" id="panel-contingency"></section>
    <section class="panel" id="panel-corp"></section>
    <section class="panel" id="panel-operations"></section>
    <section class="panel" id="panel-rules"></section>
    <section class="panel" id="panel-modifiers"></section>
    <section class="panel" id="panel-keywords"></section>
  </main>
</div>

<!-- Mobile nav menu overlay (small screens) -->
<div id="navMenu" role="dialog" aria-modal="true" aria-label="Navigation menu">
  <div class="navhead">
    <img class="navlogo" src="assets/logo_white.png" alt="MERCS">
    <span class="navwm">Companion</span>
    <button class="navclose" id="navCloseBtn" aria-label="Close menu">✕</button>
  </div>
  <div class="navlist" id="navList"></div>
  <div class="navsep"></div>
  <div class="navactlabel">Quick Actions</div>
  <div class="navacts" id="navActs"></div>
</div>

<!-- Google Translate Element host (hidden) -->
<div id="gte"></div>

<nav id="tabbar"></nav>

<!-- Tools overlay -->
<div class="tools" id="tools"><div class="toolsheet">
  <div class="toolsbar">
    <button class="backbtn" id="toolsBack" style="display:none">‹ Tools</button>
    <h2 id="toolsTitle">Field Tools</h2><span class="sp"></span>
    <button class="iconbtn" id="toolsClose" aria-label="Close">✕</button>
  </div>
  <div class="toolscont" id="toolsBody"></div>
</div></div>

<!-- Search overlay -->
<div class="search" id="search"><div class="searchsheet">
  <div class="searchhead">
    <input id="searchInput" type="search" placeholder="Search units, cards, rules…" autocomplete="off">
    <button class="iconbtn" id="searchClose" aria-label="Close">✕</button>
  </div>
  <div class="searchcont" id="searchResults"></div>
</div></div>

<div class="pop" id="pop"><div class="popcard" id="popcard"></div></div>
<div class="toast" id="toast"></div>
<div class="offbar" id="offbar" role="status" aria-live="polite"><span class="spin"></span><span class="offmsg">Saving cards for offline…</span></div>
<div class="spinner" id="spinner"><i></i></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
</body>
</html>
